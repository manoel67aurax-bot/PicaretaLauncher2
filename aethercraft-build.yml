# Gera o APK do AetherCraft no GitHub (dá pra disparar pelo celular: aba Actions > Run workflow).
name: AetherCraft APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Arquitetura (arm64 = quase todo celular atual)"
        default: "arm64"
        type: choice
        options: [arm64, arm, x86_64, all]
      variant:
        description: "Debug (pra testar) ou Release"
        default: "Debug"
        type: choice
        options: [Debug, Release]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARCH: ${{ inputs.arch || 'arm64' }}
      VARIANT: ${{ inputs.variant || 'Debug' }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Pelo celular é mais fácil subir UM zip do que várias pastas: o workflow desempacota sozinho.
      - name: Desempacotar overlay
        run: |
          if [ -f aethercraft-overlay.zip ]; then unzip -o -q aethercraft-overlay.zip && echo "overlay extraído"; fi
          test -d aether-core || { echo "::error::Faltou subir aethercraft-overlay.zip (ou as pastas aether-core/aether-ui)"; exit 1; }

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Rust + alvos Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            aether-core/rust/target
          key: aether-rust-${{ runner.os }}-${{ hashFiles('aether-core/rust/Cargo.toml') }}

      - name: cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Testes do núcleo Rust
        working-directory: aether-core/rust
        run: cargo test --locked || cargo test

      - name: Ligar módulos do AetherCraft
        run: bash scripts/apply-aether.sh

      - name: Testes Kotlin (núcleo)
        run: |
          chmod +x gradlew
          ./gradlew :aether-core:testDebugUnitTest -Darch=${ARCH} --stacktrace

      - name: Build APK
        run: |
          ./gradlew ZalithLauncher:assemble${VARIANT} -Darch=${ARCH} --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: aethercraft-${{ env.VARIANT }}-${{ env.ARCH }}
          path: ZalithLauncher/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aethercraft-testes
          path: aether-core/build/reports/tests/
          if-no-files-found: ignore
